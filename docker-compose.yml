services:
  # ── FalkorDB ──────────────────────────────────────────────────────────────
  falkordb:
    image: falkordb/falkordb:latest
    container_name: argus-falkordb
    ports:
      - "6379:6379"
      - "3000:3000"        # FalkorDB browser UI
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    volumes:
      - falkordb-data:/var/lib/falkordb/data

  # ── ARGUS (API + built UI on one port) ────────────────────────────────────
  argus:
    build: .
    container_name: argus-app
    ports:
      - "8001:8001"
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      - LLM_MODEL=${LLM_MODEL:-llama-3.3-70b-versatile}
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  falkordb-data:
